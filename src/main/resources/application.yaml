server:
  port: 8081

spring:
  application:
    name: agendador-tarefas
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/db_agendador}

tarefa:
  max-tentativas: 5

jwt:
  secret: ${APP_JWT_SECRET:chave-super-secreta-minima-32-caracteres-para-HS512-2026}
  expiration-ms: 3600000
  service-expiration-ms: 1800000