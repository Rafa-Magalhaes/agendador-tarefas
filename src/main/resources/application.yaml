server:
  port: 8081

spring:
  application:
    name: agendador-tarefas

  data:
    mongodb:
      host: localhost
      port: 27017

jwt:
  # Usa variável de ambiente. Se não existir, usa o valor padrão (apenas para desenvolvimento)
  secret: ${JWT_SECRET:minhaChaveSuperSecretaParaAssinarOToken1234567890}
  expiration: 3600000   # 1 hora em milissegundos

usuario:
  service:
    url: ${USUARIO_SERVICE_URL:http://localhost:8080}